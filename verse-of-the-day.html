<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Verse of the Day</title>
<link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<header class="app-banner"><picture><source type="image/webp" srcset="images/alpha-sky-banner-800.webp 800w, images/alpha-sky-banner-1600.webp 1600w" sizes="(min-width: 60rem) min(72rem, calc(100vw - 32px)), 100vw"><img src="images/alpha-sky-banner-1600.jpg" srcset="images/alpha-sky-banner-800.jpg 800w, images/alpha-sky-banner-1600.jpg 1600w" sizes="(min-width: 60rem) min(72rem, calc(100vw - 32px)), 100vw" width="1600" height="455" alt="Aleph-Tav (את) in a cloudy sky" decoding="async" fetchpriority="high"></picture></header>
<main>
<article id="votd" class="card" aria-label="Verse of the day"></article>
<p class="note">Tap a name for its Hebrew. Tap the verse to read the whole chapter.</p>
</main>
<script src="js/hebrew-reveal.js"></script>
<script src="js/hebrew-speech.js"></script>
<script src="js/learn.js"></script>
<script src="js/bible-data.js"></script>
<script src="js/app-shell.js"></script>
<script src="js/votd.js"></script>
<script>
AppShell.init({ page: 'votd' }).then(function (ctx) {
  return fetch('verse-refs.json').then(function (r) { return r.json(); }).then(function (d) {
    return VerseOfTheDay.mount(document.getElementById('votd'), ctx, d.refs);
  });
});
</script>
</body>
</html>
